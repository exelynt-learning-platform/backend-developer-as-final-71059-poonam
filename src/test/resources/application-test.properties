# ==========================================
# TEST APPLICATION CONFIGURATION (H2 IN-MEMORY)
# ==========================================

spring.application.name=ResourceBookingSystem-Test

server.port=8080

spring.datasource.url=jdbc:h2:mem:bookingsystem_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

jwt.secret=ResourceBookingSystemSecretKey2026VerySecureKey123456789
jwt.expiration=86400000

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
